# How ingredient names map to foods, plus what's needed to convert to grams.
#
#   nevo:     NEVO code (RIVM Dutch food composition database), for nutrition.
#             `grocery nevo suggest` lists candidates for foods without one.
#   piece_g:  grams per piece ("2 onions")
#   units:    grams per named unit ("3 cloves", "1 blik")
#   density:  grams per ml (el/tl/ml → g)
#   aisle:    section heading on the shopping list
#   synonyms: other spellings / Dutch names; matching is case-insensitive
#
# Weights below are rough household averages; adjust to what you buy.
# NEVO values are per 100 g *edible part*, and recipes are weighed raw, so
# prefer the "rauw" entry unless the recipe really uses a cooked product.

# Walking order through the shop. Aisles not listed here sort after these.
aisles:
  - groente & fruit
  - vlees & vis
  - zuivel & eieren
  - kaas
  - plantaardig 
  - pasta, rijst & wereldkeuken
  - conserven & sauzen
  - kruiden & specerijen
  - ontbijt & bakproducten
  - olie & azijn

