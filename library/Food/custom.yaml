# Your own nutrition values, per 100 g (or 100 ml), for foods NEVO lacks.
# Use a food with `custom: <name>` in aliases.yaml. Leave out what the
# source doesn't list: missing means unknown, not 0.
#
# `nutrients:` uses NEVO's nutrient codes and units, so these values land in
# the same report rows (µg: VITA_RAE, FOL, VITB12, VITD, VITK, SE, ID; the rest mg).
# Vitamins/minerals come from Ciqual 2025 (ANSES, France), copied unrounded.
# Conversions from Ciqual's columns:
#   VITA_RAE  Ciqual "vitamin A activity" (= retinol + beta-carotene/12, i.e. RAE);
#             where that is blank but beta-carotene is given: beta-carotene/12
#   FOL       dietary folate equivalents; for natural foods = total folate
#   NIAEQ     preformed niacin only: Ciqual has no tryptophan, so slightly low
#   VITE      alpha-tocopherol where given, else Ciqual "vitamin E"
#   VITK      vitamin K1 (+ K2 where given)
#   "< x"     (below detection limit) left out = unknown; "traces" = 0, as NEVO does
